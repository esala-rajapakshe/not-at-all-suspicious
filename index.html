<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Are you smart?</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #1e1b4b, #4c1d95);
    color: #fff; touch-action: none;
  }
  .stage {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 24px;
  }
  h1 { font-size: clamp(2rem, 8vw, 3.5rem); margin: 0 0 32px; }
  .buttons { display: flex; gap: 20px; }
  button {
    font: inherit; font-size: 1.25rem; font-weight: 600;
    padding: 14px 36px; border: none; border-radius: 12px; cursor: pointer;
    color: #fff; user-select: none; -webkit-user-select: none;
  }
  #no  { background: #ef4444; }
  #yes { background: #22c55e; }
  #yes.runaway { position: fixed; transition: left .15s ease-out, top .15s ease-out; z-index: 10; }
  #msg { margin-top: 32px; min-height: 2em; font-size: 1.25rem; opacity: .9; }
</style>
</head>
<body>
<div class="stage">
  <h1>Are you smart?</h1>
  <div class="buttons">
    <button id="yes">Yes</button>
    <button id="no">No</button>
  </div>
  <div id="msg"></div>
</div>

<script>
(function () {
  var yes = document.getElementById('yes');
  var no = document.getElementById('no');
  var msg = document.getElementById('msg');
  var taunts = [
    "Nice try.", "Too slow!", "Nope.", "Almost!", "Missed me.",
    "Is that your best?", "Try harder.", "Not today."
  ];

  var lastTaunt = -1, lastSay = 0;
  function say() {
    var now = Date.now();
    if (now - lastSay < 700) return; // change text at most once per 0.7s
    lastSay = now;
    var i;
    do { i = Math.floor(Math.random() * taunts.length); } while (i === lastTaunt);
    lastTaunt = i;
    msg.textContent = taunts[i];
  }

  function overlaps(x, y, w, h, el) {
    var r = el.getBoundingClientRect(), pad = 12;
    return x < r.right + pad && x + w > r.left - pad &&
           y < r.bottom + pad && y + h > r.top - pad;
  }

  function flee(px, py, withTaunt) {
    var w = yes.offsetWidth, h = yes.offsetHeight;
    var maxX = window.innerWidth - w - 8, maxY = window.innerHeight - h - 8;
    var x, y, tries = 0;

    if (!yes.classList.contains('runaway')) {
      var r = yes.getBoundingClientRect();
      yes.classList.add('runaway');
      yes.style.left = r.left + 'px';
      yes.style.top = r.top + 'px';
      void yes.offsetWidth; // flush so the first jump animates
    }

    do {
      x = 8 + Math.random() * Math.max(0, maxX - 8);
      y = 8 + Math.random() * Math.max(0, maxY - 8);
      tries++;
    } while (tries < 40 && (
      overlaps(x, y, w, h, no) ||
      (px != null && Math.hypot(x + w / 2 - px, y + h / 2 - py) < 160)
    ));

    yes.style.left = x + 'px';
    yes.style.top = y + 'px';
    say();
  }

  // Desktop: dodge as the cursor gets close.
  var lastHover = 0;
  document.addEventListener('mousemove', function (e) {
    var now = Date.now();
    if (now - lastHover < 200) return; // let the last jump finish first
    var r = yes.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    if (Math.hypot(e.clientX - cx, e.clientY - cy) < 110) {
      lastHover = now;
      flee(e.clientX, e.clientY, false);
    }
  });

  // Mobile + any pointer: dodge the moment it is touched or clicked.
  // One tap fires several events (touchstart, pointerdown, mousedown, click),
  // so only react once per 400ms; the rest are still blocked.
  var lastDodge = 0;
  function dodge(e) {
    e.preventDefault();
    e.stopPropagation();
    var now = Date.now();
    if (now - lastDodge < 400) return;
    lastDodge = now;
    var t = e.touches && e.touches[0];
    flee(t ? t.clientX : e.clientX, t ? t.clientY : e.clientY, true);
  }
  ['touchstart', 'pointerdown', 'mousedown', 'click'].forEach(function (ev) {
    yes.addEventListener(ev, dodge, { passive: false });
  });
  yes.addEventListener('keydown', function (e) { flee(null, null, true); });

  // Keep it on screen if the window is resized or rotated.
  window.addEventListener('resize', function () {
    if (yes.classList.contains('runaway')) flee();
  });

  no.addEventListener('click', function () {
    msg.textContent = "Honest. Respect.";
  });
})();
</script>
</body>
</html>
