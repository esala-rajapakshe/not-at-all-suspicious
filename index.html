<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#F5EDEF">
<title>Will you go on a date with me?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300;1,9..144,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; touch-action: none;
    background: #F5EDEF; color: #3B2A31;
    font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }

  /* quiet background hearts */
  .deco { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
  .deco svg { position: absolute; fill: none; stroke: #A94766; stroke-width: 1.5; stroke-linejoin: round; animation: drift 14s ease-in-out infinite; }
  @keyframes drift {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-14px); }
  }

  .stage { position: relative; height: 100%; display: flex; align-items: center; justify-content: center; padding: 32px; }
  .panel {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    width: 100%; max-width: 440px;
    animation: fadeIn .9s ease both;
  }
  .panel.hidden { display: none; }
  /* opacity only: a transform animation would make this box the containing
     block for the fixed-position "No", sending it outside the screen */
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  h1 {
    margin: 24px 0 0;
    font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 300;
    font-size: clamp(2.4rem, 9vw, 3.4rem); line-height: 1.15; color: #3B2A31;
  }
  .sub { margin: 14px 0 0; font-size: 1rem; line-height: 1.5; color: #6B5A61; }

  .buttons { display: flex; gap: 12px; width: 100%; margin-top: 36px; align-items: center; }
  button {
    font: inherit; font-size: 1.0625rem; height: 56px; border-radius: 999px; cursor: pointer;
    user-select: none; -webkit-user-select: none;
  }
  button:focus-visible { outline: 3px solid #3B2A31; outline-offset: 3px; }
  #yes {
    flex: 1.4; border: 0; background: #A94766; color: #fff; font-weight: 600;
    transition: transform .35s ease, background .2s ease;
  }
  #yes:hover { background: #983D5A; }
  .slot { flex: 1; height: 56px; border-radius: 999px; border: 1px solid transparent; transition: border-color .4s ease; }
  .slot.ghost { border: 1px dashed #D9C6CC; }
  #no {
    width: 100%; border: 1px solid #D9C6CC; background: transparent; color: #6B5A61; font-weight: 500;
  }
  #no.runaway { position: fixed; z-index: 20; background: #F5EDEF; transition: left .45s cubic-bezier(.2,.8,.2,1), top .45s cubic-bezier(.2,.8,.2,1); }

  #msg { min-height: 22px; margin: 18px 0 0; font-size: .9375rem; font-style: italic; color: #A94766; transition: opacity .3s ease; }

  .badge {
    width: 80px; height: 80px; border-radius: 999px; background: #EBD6DD;
    display: flex; align-items: center; justify-content: center;
  }

  @media (prefers-reduced-motion: reduce) {
    .deco svg, .panel { animation: none; }
    #yes, #no.runaway, .slot { transition: none; }
  }
</style>
</head>
<body>

<div class="deco" aria-hidden="true" id="deco"></div>

<div class="stage">
  <main class="panel" id="ask">
    <svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#A94766" stroke-width="1.25" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-9.2-9.4C1.6 7.8 3.7 4.5 7 4.5c2 0 3.4 1 5 3 1.6-2 3-3 5-3 3.3 0 5.4 3.3 4.2 6.6C19.5 15.9 12 20.5 12 20.5z"/></svg>
    <h1>Will you go on a date with me?</h1>
    <p class="sub">No pressure. Truly.</p>
    <div class="buttons">
      <button type="button" id="yes">Yes</button>
      <div class="slot" id="slot"><button type="button" id="no">No</button></div>
    </div>
    <p id="msg" aria-live="polite"></p>
  </main>

  <main class="panel hidden" id="win" aria-live="polite">
    <div class="badge">
      <svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="#A94766" stroke="#A94766" stroke-width="1.25" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-9.2-9.4C1.6 7.8 3.7 4.5 7 4.5c2 0 3.4 1 5 3 1.6-2 3-3 5-3 3.3 0 5.4 3.3 4.2 6.6C19.5 15.9 12 20.5 12 20.5z"/></svg>
    </div>
    <h1 style="margin-top: 28px; font-size: clamp(2.6rem, 10vw, 3.6rem)">It's a date.</h1>
    <p class="sub">Thanks for saying yes.</p>
  </main>
</div>

<script>
(function () {
  var yes = document.getElementById('yes');
  var no = document.getElementById('no');
  var slot = document.getElementById('slot');
  var msg = document.getElementById('msg');
  var ask = document.getElementById('ask');
  var win = document.getElementById('win');

  /* ---------- faint background hearts ---------- */
  var deco = document.getElementById('deco');
  var path = 'M12 20.5s-7.5-4.6-9.2-9.4C1.6 7.8 3.7 4.5 7 4.5c2 0 3.4 1 5 3 1.6-2 3-3 5-3 3.3 0 5.4 3.3 4.2 6.6C19.5 15.9 12 20.5 12 20.5z';
  [
    { l: '8%',  t: '14%', s: 22, o: .22, d: 0 },
    { l: '86%', t: '20%', s: 16, o: .18, d: -4 },
    { l: '14%', t: '78%', s: 28, o: .16, d: -8 },
    { l: '80%', t: '72%', s: 18, o: .20, d: -2 },
    { l: '50%', t: '8%',  s: 14, o: .14, d: -6 },
    { l: '66%', t: '90%', s: 20, o: .14, d: -10 }
  ].forEach(function (h) {
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('width', h.s);
    svg.setAttribute('height', h.s);
    svg.style.left = h.l; svg.style.top = h.t; svg.style.opacity = h.o;
    svg.style.animationDelay = h.d + 's';
    var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', path);
    svg.appendChild(p);
    deco.appendChild(svg);
  });

  /* ---------- the shy "No" ---------- */
  var lines = [
    'Are you sure?', 'Take your time.', 'Hmm, that one is shy.',
    'Just checking.', 'The other one is friendlier.', 'Really?'
  ];
  var lastLine = -1, lastSay = 0, scale = 1;

  function say() {
    var now = Date.now();
    if (now - lastSay < 700) return;       // change text at most once per 0.7s
    lastSay = now;
    var i;
    do { i = Math.floor(Math.random() * lines.length); } while (i === lastLine);
    lastLine = i;
    msg.textContent = lines[i];
  }

  function overlaps(x, y, w, h, el) {
    var r = el.getBoundingClientRect(), pad = 16;
    return x < r.right + pad && x + w > r.left - pad &&
           y < r.bottom + pad && y + h > r.top - pad;
  }

  function flee(px, py) {
    var w = no.offsetWidth, h = no.offsetHeight;

    if (!no.classList.contains('runaway')) {
      var r = no.getBoundingClientRect();
      w = r.width; h = r.height;
      no.style.width = w + 'px';
      no.classList.add('runaway');
      no.style.left = r.left + 'px';
      no.style.top = r.top + 'px';
      slot.classList.add('ghost');
      document.body.appendChild(no);        // lift it out of the panel so it is positioned against the screen
      void no.offsetWidth;                  // flush so the first hop animates
    }

    var vw = Math.min(window.innerWidth, document.documentElement.clientWidth || window.innerWidth);
    var vh = Math.min(window.innerHeight, document.documentElement.clientHeight || window.innerHeight);
    var maxX = vw - w - 12, maxY = vh - h - 12;
    var x, y, tries = 0;
    do {
      x = 12 + Math.random() * Math.max(0, maxX - 12);
      y = 12 + Math.random() * Math.max(0, maxY - 12);
      tries++;
    } while (tries < 40 && (
      overlaps(x, y, w, h, yes) ||
      (px != null && Math.hypot(x + w / 2 - px, y + h / 2 - py) < 180)
    ));

    no.style.left = x + 'px';
    no.style.top = y + 'px';

    scale = Math.min(1.2, scale + 0.03);    // "Yes" grows a touch each time
    yes.style.transform = 'scale(' + scale + ')';
    say();
  }

  // Desktop: hop away as the cursor nears (at most once per 250ms)
  var lastHover = 0;
  document.addEventListener('mousemove', function (e) {
    var now = Date.now();
    if (now - lastHover < 250) return;
    var r = no.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    if (Math.hypot(e.clientX - cx, e.clientY - cy) < 100) {
      lastHover = now;
      flee(e.clientX, e.clientY);
    }
  });

  // Touch / click: hop the moment it is touched. One tap fires several
  // events, so react once per 400ms and still block the rest.
  var lastDodge = 0;
  function dodge(e) {
    e.preventDefault();
    e.stopPropagation();
    var now = Date.now();
    if (now - lastDodge < 400) return;
    lastDodge = now;
    var t = e.touches && e.touches[0];
    flee(t ? t.clientX : e.clientX, t ? t.clientY : e.clientY);
  }
  ['touchstart', 'pointerdown', 'mousedown', 'click'].forEach(function (ev) {
    no.addEventListener(ev, dodge, { passive: false });
  });
  no.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flee(); }
  });

  window.addEventListener('resize', function () {
    if (no.classList.contains('runaway')) flee();
  });

  /* ---------- Yes ---------- */
  yes.addEventListener('click', function () {
    ask.classList.add('hidden');
    no.style.display = 'none';
    win.classList.remove('hidden');
  });
})();
</script>
</body>
</html>
